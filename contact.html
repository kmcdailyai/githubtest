<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의 | 새벽뉴스</title>
  <meta name="description" content="새벽뉴스에 제휴, 제안, 오류 제보를 보내는 페이지입니다.">
  <meta property="og:site_name" content="새벽뉴스">
  <meta property="og:type" content="website">
  <meta property="og:title" content="문의">
  <meta property="og:description" content="새벽뉴스에 제휴, 제안, 오류 제보를 보내는 페이지입니다.">
  <meta property="og:url" content="https://githubtest2.pages.dev/contact">
  <link rel="canonical" href="https://githubtest2.pages.dev/contact">
  <meta name="google-adsense-account" content="ca-pub-3379650896174105">
  <!-- 광고 없는 페이지: 콘텐츠가 아닌 페이지(문의·404)에는 광고를 넣지 않음 -->

  <!-- 화면이 그려지기 전에 저장된 모드를 먼저 적용 (깜빡임 방지) -->
  <script>
    (function () {
      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved === "dark" || (!saved && prefersDark)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header>
    <div class="wrap top">
      <div>
        <p class="logo"><a href="/">새벽<span>뉴스</span></a></p>
        <p class="tagline">AI와 함께 웹사이트를 직접 만들고 운영하며 배운 기록</p>
      </div>
      <button id="modeBtn" type="button">🌙 다크모드</button>
    </div>
  </header>

  <div class="wrap">
    <nav class="site-nav" aria-label="주 메뉴">
      <a href="/">홈</a>
      <a href="/#articles">전체 글</a>
      <a href="/about">소개</a>
      <a href="/contact" class="on">문의</a>
    </nav>

    <section class="article contact">
      <h1>문의</h1>
      <p class="lead">광고·협업 제휴, 글에 대한 제안, 잘못된 내용 제보를 남겨 주세요. 확인 후 이메일로 답변드립니다.</p>

      <form id="contactForm" action="https://formspree.io/f/mvkzvkqk" method="POST">
        <div>
          <label for="name">이름 / 단체명</label>
          <input id="name" name="이름" type="text" required>
        </div>
        <div>
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" required>
        </div>
        <div>
          <label for="phone">연락처 <small>(선택)</small></label>
          <input id="phone" name="연락처" type="tel">
        </div>
        <div>
          <label for="kind">문의 종류</label>
          <select id="kind" name="문의 종류">
            <option>광고 제휴</option>
            <option>콘텐츠 협업</option>
            <option>오류 제보</option>
            <option>기타</option>
          </select>
        </div>
        <div class="full">
          <label for="message">문의 내용</label>
          <textarea id="message" name="문의 내용" required></textarea>
        </div>
        <input type="hidden" name="_subject" value="[새벽뉴스] 새 문의">
        <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off">
        <div class="full">
          <button type="submit">문의 보내기</button>
          <p id="formMsg" role="status"></p>
        </div>
      </form>
      <p class="meta">보내 주신 정보는 답변에만 사용합니다. 자세한 내용은 <a href="/privacy">개인정보처리방침</a>을 확인해 주세요.</p>
    </section>
  </div>

  <footer>
    <nav aria-label="사이트 정보">
      <a href="/about">소개</a>
      <a href="/privacy">개인정보처리방침</a>
      <a href="/contact">문의</a>
    </nav>
    © 2026 새벽뉴스. 직접 해 본 것만 씁니다.
  </footer>

  <script src="/site.js"></script>
</body>
</html>
